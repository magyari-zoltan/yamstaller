disks:
  - device: /dev/sda
    table: gpt
    wipe: false

    partitions:
      - label: EFI
        size: 512M
        type: EFI System
        filesystem: vfat
        mount_point: /boot/efi
        force: true

      - label: ROOT
        size: 50G
        type: Linux filesystem
        encryption:
          type: luks
          mapping: cryptroot
        filesystem: ext4
        mount_point: /
        force: true

      - label: HOME
        size: rest
        type: Linux filesystem
        encryption:
          type: luks
          mapping: crypthome
        filesystem: ext4
        mount_point: /home
